<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SkyCool Flux Pods Simulation</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111827; /* dark slate for readability */
    }

    /* Landing screen - light theme */
    #landing {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #071D2B, #07313E);
      text-align: center;
      transition: all 1s ease;
    }
    #landing h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
  background: linear-gradient(90deg, #ff7854, #ffcc70);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
    }
    #landing p {
      color: #ffffff; /* slate-700 */
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    #landing button {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: linear-gradient(90deg, #e2e8f0, #cbd5e1);
      color: #111827;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(16,24,40,0.06);
    }
    #landing button:hover {
      background: linear-gradient(90deg, #dbe6f0, #c4d0da);
      transform: translateY(-2px);
    }

    /* Simulation screen - light theme */
    #simulation {
      opacity: 0;
      transform: translateY(50px);
      pointer-events: none;
      transition: opacity 1s ease, transform 1s ease;
      background: linear-gradient(135deg, #071D2B, #07313E);
      color: #111827;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
      overflow: auto;
      border-top: 1px solid rgba(15,23,42,0.04);
    }
    #simulation.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #simulation h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-align: center;
      background: linear-gradient(90deg, #ff7854, #ffcc70);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: 1px;
    }
    #simulation .instruction {
      max-width: 850px;
      text-align: center;
      margin: 10px auto 25px auto;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #475569; /* slate-600 */
    }
    #simulation canvas {
      border: 1px solid #000000; /* soft blue border */
      cursor: grab;
      background: radial-gradient(circle at center, #000000, #000000); /* light blue surface */
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(14,46,90,0.06);
    }
    #simulation .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button.ctrl {
      padding: 10px 18px;
      background: linear-gradient(90deg, #dbeeff, #c6e0ff); /* blue-ish */
      color: #022c57; /* deep blue text */
      border: 1px solid rgba(3,57,115,0.06);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: 0 6px 18px rgba(3,37,77,0.06);
    }
    button.ctrl:hover {
      background: linear-gradient(90deg, #c6e0ff, #a6d0ff);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Landing screen -->
  <div id="landing">
    <h1>[ SkyCool™ Flux Pods ]</h1>
    <p>Do you want to see the ML heat circulation simulation?</p>
  <button id="startBtn" data-href="pls.html">Yes, take me there!</button>
  </div>
</body>
</html>
